[package]
name = "quietflow-tauri"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# PC/SC smart card library
pcsc = "2"
hex = "0.4"
thiserror = "1"
log = "0.4"

[build-dependencies]
tauri-build = { version = "2", features = [] }